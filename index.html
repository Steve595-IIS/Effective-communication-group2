<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Effective Communication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Rajdhani', -apple-system, sans-serif;
    }
    @keyframes cyberGridFloor {
      0% { transform: perspective(550px) rotateX(68deg) translateY(0); }
      100% { transform: perspective(550px) rotateX(68deg) translateY(55px); }
    }
    @keyframes robotLevitate {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.4deg); }
    }
    @keyframes colorCycleBreath {
      0%, 100% {
        color: #0044ff;
        text-decoration-color: #0044ff;
        opacity: 0.75;
        text-shadow: 0 0 10px rgba(0, 68, 255, 0.85), 0 0 22px rgba(0, 68, 255, 0.55);
        transform: translateY(0px);
      }
      25% {
        color: #38bdf8;
        text-decoration-color: #38bdf8;
        opacity: 0.9;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.9), 0 0 25px rgba(56, 189, 248, 0.65);
        transform: translateY(-0.5px);
      }
      50% {
        color: #ffffff;
        text-decoration-color: #ffffff;
        opacity: 1;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.95), 0 0 28px rgba(186, 230, 253, 0.8), 0 0 42px rgba(56, 189, 248, 0.5);
        transform: translateY(-1px);
      }
      75% {
        color: #38bdf8;
        text-decoration-color: #38bdf8;
        opacity: 0.9;
        text-shadow: 0 0 12px rgba(56, 189, 248, 0.9), 0 0 25px rgba(56, 189, 248, 0.65);
        transform: translateY(-0.5px);
      }
    }
    .orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .visor-clip {
      clip-path: polygon(24% 14%, 67% 12%, 75% 36%, 60% 49%, 27% 46%, 20% 30%);
      -webkit-clip-path: polygon(24% 14%, 67% 12%, 75% 36%, 60% 49%, 27% 46%, 20% 30%);
    }
    .robot-mask {
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 68%, rgba(0,0,0,0) 86%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 68%, rgba(0,0,0,0) 86%);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-black text-white cursor-pointer flex flex-col justify-between items-center" id="mainContainer">

  <!-- Background Canvas for Particles, Constellation Lines, Shockwaves -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none select-none z-0">
    <canvas id="bgCanvas" class="absolute inset-0 w-full h-full"></canvas>

    <!-- Cyber perspective grid floor -->
    <div class="absolute bottom-0 left-0 w-full h-[38vh] overflow-hidden opacity-35 pointer-events-none">
      <div
        class="w-full h-[220%] origin-bottom"
        style="
          transform: perspective(550px) rotateX(68deg);
          background-image: linear-gradient(to right, rgba(0, 240, 255, 0.3) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 240, 255, 0.3) 1px, transparent 1px);
          background-size: 55px 55px;
          mask-image: linear-gradient(to top, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 95%);
          -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 95%);
          animation: cyberGridFloor 2s linear infinite;
        "
      ></div>
      <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#00f0ff] to-transparent shadow-[0_0_24px_#00f0ff] opacity-80"></div>
    </div>

    <!-- Vignette -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_40%,rgba(0,0,0,0.85)_100%)] pointer-events-none"></div>
  </div>

  <!-- Click Kinetic Surge Overlay -->
  <div id="surgeOverlay" class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-500 z-[4]" style="background: radial-gradient(circle at center, rgba(0, 240, 255, 0.4) 0%, rgba(255, 255, 255, 0.2) 30%, transparent 70%);"></div>

  <!-- Central Stage -->
  <div class="relative flex-1 w-full max-w-[1500px] mx-auto flex flex-col justify-end items-center px-4 z-10 overflow-hidden">
    
    <!-- Title: EFFECTIVE COMMUNICATION -->
    <div class="absolute top-[11vh] sm:top-[10vh] inset-x-0 flex flex-col items-center justify-center text-center pointer-events-none z-10 px-2 orbitron">
      <div id="titleGlow" class="absolute w-3/4 max-w-5xl h-60 -top-6 rounded-full blur-3xl opacity-40 transition-all duration-300 pointer-events-none bg-cyan-500"></div>

      <h1 class="relative font-black uppercase flex flex-col items-center leading-[0.88] select-none w-full max-w-full">
        <span
          class="text-[clamp(2.75rem,11.5vw,11rem)] text-white font-black drop-shadow-[0_0_35px_rgba(0,240,255,0.95)] drop-shadow-[0_0_80px_rgba(0,180,255,0.5)] whitespace-nowrap"
          style="letter-spacing: 0.04em; -webkit-text-stroke: 1.2px rgba(255,255,255,0.4);"
        >
          EFFECTIVE
        </span>
        <span
          class="text-[clamp(2.1rem,9.2vw,9.2rem)] font-black drop-shadow-[0_0_40px_rgba(0,240,255,1)] drop-shadow-[0_0_90px_rgba(0,240,255,0.6)] -mt-0.5 sm:-mt-1 whitespace-nowrap"
          style="
            letter-spacing: 0.03em;
            background: linear-gradient(180deg, #ffffff 20%, #cffafe 65%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 24px rgba(0, 240, 255, 0.9));
          "
        >
          COMMUNICATION
        </span>
      </h1>
    </div>

    <!-- Robot Companion in Front -->
    <div class="relative z-20 flex items-end justify-center w-full mt-auto">
      <div id="robotContainer" class="relative z-20 flex flex-col items-center justify-end select-none pointer-events-none translate-y-[20vh] sm:translate-y-[38vh]" style="width: min(98vw, 760px); perspective: 1000px;">
        
        <div class="absolute top-8 w-[95%] h-[85%] rounded-full opacity-70 blur-3xl pointer-events-none" style="background: radial-gradient(circle, rgba(0, 240, 255, 0.7) 0%, rgba(0, 140, 255, 0.35) 50%, transparent 75%);"></div>

        <div id="robotStage" class="relative w-full aspect-[819/1024] transition-transform duration-75 ease-out robot-mask" style="transform-style: preserve-3d; animation: robotLevitate 5s ease-in-out infinite;">
          <img
            src="https://i.imgur.com/pBb5wl3.png"
            alt="Cyber Robot"
            class="w-full h-full object-contain object-top drop-shadow-[0_25px_60px_rgba(0,0,0,0.98)] drop-shadow-[0_0_45px_rgba(0,240,255,0.55)] filter contrast-105"
          />

          <!-- Visor mask -->
          <div class="absolute inset-0 overflow-hidden pointer-events-none visor-clip">
            <div id="eyesWrapper" class="absolute origin-center transition-transform duration-75 ease-out" style="left: 32.8%; top: 28.2%; width: 25.4%; height: 11.3%;">
              <canvas id="eyesCanvas" width="260" height="145" class="w-full h-full object-contain filter drop-shadow-[0_0_14px_#00f0ff] drop-shadow-[0_0_28px_rgba(0,240,255,0.9)] brightness-125"></canvas>
            </div>
          </div>

          <!-- Ambient sheen -->
          <div class="absolute inset-0 pointer-events-none opacity-30 mix-blend-screen visor-clip" style="background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 40%, rgba(0,240,255,0.2) 100%);"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Underlined link: CLICK ANYWHERE TO CONTINUE -->
  <footer class="absolute bottom-4 sm:bottom-6 z-30 flex flex-col items-center justify-center">
    <a
      id="continueLink"
      href="https://effective-communication-group-2.netlify.app/"
      target="_blank"
      rel="noopener noreferrer"
      class="orbitron text-[11px] sm:text-xs font-light tracking-[0.45em] sm:tracking-[0.6em] uppercase underline underline-offset-4 hover:brightness-125 transition-all cursor-pointer"
      style="animation: colorCycleBreath 3.6s ease-in-out infinite;"
    >
      CLICK ANYWHERE TO CONTINUE
    </a>
  </footer>

  <script>
    // --- 1. Synthesized Web Audio Cyber Pulse ---
    let audioCtx = null;
    function playCyberPulseSound() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        osc1.frequency.exponentialRampToValueAtTime(1318.5, now + 0.08);
        gain1.gain.setValueAtTime(0.08, now);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(164.81, now);
        osc2.frequency.exponentialRampToValueAtTime(82.4, now + 0.25);
        gain2.gain.setValueAtTime(0.12, now);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now);
        osc2.stop(now + 0.3);
      } catch (e) {}
    }

    // --- 2. Canvas Background & Particles Animation ---
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d', { alpha: false });
    let width = bgCanvas.width = window.innerWidth;
    let height = bgCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = bgCanvas.width = window.innerWidth;
      height = bgCanvas.height = window.innerHeight;
    });

    const particles = [];
    const colors = ['#00f0ff', '#ffffff', '#38bdf8', '#e0f2fe', '#00b4d8'];
    const pCount = Math.min(65, Math.floor((width * height) / 25000));

    for (let i = 0; i < pCount; i++) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const size = Math.random() * 2.2 + 0.8;
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -(Math.random() * 0.5 + 0.2),
        size,
        alpha: Math.random() * 0.7 + 0.25,
        alphaSpeed: (Math.random() * 0.012 + 0.004) * (Math.random() > 0.5 ? 1 : -1),
        color,
        glowColor: color === '#ffffff' ? '#ffffff' : '#00f0ff'
      });
    }

    const shockwaves = [];

    function triggerShockwave(x, y) {
      shockwaves.push({
        x, y,
        radius: 10,
        maxRadius: Math.max(window.innerWidth, window.innerHeight) * 0.75,
        alpha: 1
      });
    }

    function renderBg() {
      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, width, height);

      const grad = bgCtx.createRadialGradient(width * 0.5, height * 0.45, 10, width * 0.5, height * 0.45, Math.max(width, height) * 0.65);
      grad.addColorStop(0, 'rgba(0, 140, 255, 0.16)');
      grad.addColorStop(0.35, 'rgba(0, 240, 255, 0.06)');
      grad.addColorStop(0.7, 'rgba(1, 8, 20, 0.4)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, 0, width, height);

      const pLen = particles.length;
      bgCtx.lineWidth = 0.75;
      for (let i = 0; i < pLen; i++) {
        for (let j = i + 1; j < pLen; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < 110) {
            const lineAlpha = (1 - dist / 110) * 0.22 * Math.min(particles[i].alpha, particles[j].alpha);
            bgCtx.strokeStyle = `rgba(0, 240, 255, ${lineAlpha})`;
            bgCtx.beginPath();
            bgCtx.moveTo(particles[i].x, particles[i].y);
            bgCtx.lineTo(particles[j].x, particles[j].y);
            bgCtx.stroke();
          }
        }
      }

      for (let i = 0; i < pLen; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha += p.alphaSpeed;
        if (p.alpha > 0.95 || p.alpha < 0.2) p.alphaSpeed = -p.alphaSpeed;
        if (p.y < -20) { p.y = height + 20; p.x = Math.random() * width; }
        if (p.x < -20) p.x = width + 20;
        if (p.x > width + 20) p.x = -20;

        bgCtx.save();
        bgCtx.fillStyle = p.color;
        bgCtx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
        bgCtx.shadowColor = p.glowColor;
        bgCtx.shadowBlur = p.color === '#ffffff' ? 6 : 10;
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += (sw.maxRadius - sw.radius) * 0.08 + 12;
        sw.alpha -= 0.035;
        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }
        bgCtx.save();
        bgCtx.beginPath();
        bgCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        bgCtx.strokeStyle = `rgba(0, 240, 255, ${sw.alpha * 0.8})`;
        bgCtx.lineWidth = 2.5;
        bgCtx.shadowColor = '#00f0ff';
        bgCtx.shadowBlur = 18;
        bgCtx.stroke();

        bgCtx.beginPath();
        bgCtx.arc(sw.x, sw.y, Math.max(0, sw.radius - 8), 0, Math.PI * 2);
        bgCtx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha * 0.95})`;
        bgCtx.lineWidth = 1.2;
        bgCtx.shadowColor = '#ffffff';
        bgCtx.shadowBlur = 10;
        bgCtx.stroke();
        bgCtx.restore();
      }

      requestAnimationFrame(renderBg);
    }
    renderBg();

    // --- 3. Drawing Robot LED Eyes on Canvas ---
    const eyesCanvas = document.getElementById('eyesCanvas');
    const eyeCtx = eyesCanvas.getContext('2d');

    function drawEyes() {
      eyeCtx.clearRect(0, 0, 260, 145);
      const leftEye = { x: 62, y: 81, r: 48 };
      const rightEye = { x: 195, y: 62, r: 50 };

      [leftEye, rightEye].forEach((c) => {
        eyeCtx.save();
        eyeCtx.beginPath();
        eyeCtx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        eyeCtx.clip();

        eyeCtx.translate(c.x, c.y);
        eyeCtx.rotate((-10 * Math.PI) / 180);
        eyeCtx.translate(-c.x, -c.y);

        const spacing = 5.4;
        for (let gx = c.x - c.r - 10; gx <= c.x + c.r + 10; gx += spacing) {
          for (let gy = c.y - c.r - 10; gy <= c.y + c.r + 10; gy += spacing) {
            const d = Math.hypot(gx - c.x, gy - c.y);
            if (d < c.r) {
              const alpha = Math.max(0.7, 1 - Math.pow(d / c.r, 3));
              eyeCtx.beginPath();
              eyeCtx.arc(gx, gy, 2.05, 0, Math.PI * 2);
              eyeCtx.fillStyle = `rgba(0, 240, 255, ${alpha})`;
              eyeCtx.shadowColor = '#00f0ff';
              eyeCtx.shadowBlur = 7;
              eyeCtx.fill();

              if (d < c.r * 0.85) {
                eyeCtx.beginPath();
                eyeCtx.arc(gx, gy, 1.2, 0, Math.PI * 2);
                eyeCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.98})`;
                eyeCtx.shadowColor = '#ffffff';
                eyeCtx.shadowBlur = 5;
                eyeCtx.fill();
              }
            }
          }
        }
        eyeCtx.restore();
      });
    }
    drawEyes();

    // --- 4. Interactive Eye Tracking & Head Tilt ---
    const robotContainer = document.getElementById('robotContainer');
    const robotStage = document.getElementById('robotStage');
    const eyesWrapper = document.getElementById('eyesWrapper');
    let isBlinking = false;
    let isExcited = false;
    let currentNormX = 0;
    let currentNormY = -0.2;

    function applyTransforms(normX, normY) {
      const offsetX = normX * 26;
      const offsetY = normY < 0 ? normY * 34 : normY * 15;
      const scaleX = isBlinking ? 1.08 : isExcited ? 1.15 : 1;
      const scaleY = isBlinking ? 0.08 : isExcited ? 1.15 : 1;

      eyesWrapper.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${scaleX}, ${scaleY})`;
      const tiltX = Math.max(-8.5, Math.min(8.5, normX * 8.5));
      const tiltY = Math.max(-9, Math.min(9, normY * 9));
      robotStage.style.transform = `rotateX(${-tiltY}deg) rotateY(${tiltX}deg)`;
    }

    window.addEventListener('mousemove', (e) => {
      const rect = robotContainer.getBoundingClientRect();
      const faceCenterX = rect.left + rect.width * 0.48;
      const baselineY = rect.top + rect.height * 0.35;
      const reachX = Math.max(window.innerWidth * 0.5, 450);
      const reachTop = Math.max(baselineY, 200);
      const reachBottom = Math.max(window.innerHeight - baselineY, 180);

      const dx = e.clientX - faceCenterX;
      const dy = e.clientY - baselineY;
      const normX = Math.max(-1, Math.min(1, dx / reachX));
      const normY = Math.max(-1, Math.min(1, dy < 0 ? dy / reachTop : dy / reachBottom));

      currentNormX = normX;
      currentNormY = normY;
      applyTransforms(normX, normY);
    });

    // Natural blinking loop
    function scheduleBlink() {
      const delay = Math.random() * 3500 + 2500;
      setTimeout(() => {
        isBlinking = true;
        applyTransforms(currentNormX, currentNormY);
        setTimeout(() => {
          isBlinking = false;
          applyTransforms(currentNormX, currentNormY);
          if (Math.random() > 0.65) {
            setTimeout(() => {
              isBlinking = true;
              applyTransforms(currentNormX, currentNormY);
              setTimeout(() => {
                isBlinking = false;
                applyTransforms(currentNormX, currentNormY);
                scheduleBlink();
              }, 120);
            }, 100);
          } else {
            scheduleBlink();
          }
        }, 140);
      }, delay);
    }
    scheduleBlink();

    // --- 5. Global Click Handler & Navigation ---
    const surgeOverlay = document.getElementById('surgeOverlay');
    const titleGlow = document.getElementById('titleGlow');

    document.getElementById('mainContainer').addEventListener('click', (e) => {
      playCyberPulseSound();
      triggerShockwave(e.clientX, e.clientY);

      isExcited = true;
      surgeOverlay.classList.remove('opacity-0');
      surgeOverlay.classList.add('opacity-30');
      titleGlow.classList.add('scale-120', 'opacity-80', 'bg-cyan-400');
      titleGlow.classList.remove('opacity-40', 'bg-cyan-500');

      applyTransforms(currentNormX, currentNormY);

      setTimeout(() => {
        isExcited = false;
        applyTransforms(currentNormX, currentNormY);
      }, 400);

      setTimeout(() => {
        surgeOverlay.classList.remove('opacity-30');
        surgeOverlay.classList.add('opacity-0');
        titleGlow.classList.remove('scale-120', 'opacity-80', 'bg-cyan-400');
        titleGlow.classList.add('opacity-40', 'bg-cyan-500');
      }, 500);

      if (!e.target.closest('#continueLink')) {
        setTimeout(() => {
          window.open('https://effective-communication-group-2.netlify.app/', '_blank') ||
          (window.location.href = 'https://effective-communication-group-2.netlify.app/');
        }, 260);
      }
    });
  </script>
</body>
</html>
